# CI devflow : même contrat que le hook Stop local (scripts check / build / test:e2e).
# /devflow:init adapte ce fichier au gestionnaire de paquets et à la structure du projet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Décommenter si les tests d'intégration ont besoin de PostgreSQL.
    # services:
    #   postgres:
    #     image: postgres:17
    #     env:
    #       POSTGRES_USER: test
    #       POSTGRES_PASSWORD: test
    #       POSTGRES_DB: test
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # - run: pnpm exec prisma migrate deploy   # si BDD de test

      - run: pnpm run check

      - run: pnpm run build --if-present

