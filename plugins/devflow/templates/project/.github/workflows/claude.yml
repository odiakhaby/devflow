# Claude dans GitHub (anthropics/claude-code-action) avec le plugin devflow installé.
# Prérequis : Claude GitHub App installée (/install-github-app) et secret CLAUDE_CODE_OAUTH_TOKEN
# (généré par `claude setup-token`) ou ANTHROPIC_API_KEY.
# Ne pas passer github_token: ${{ secrets.GITHUB_TOKEN }} : la CI ne se déclencherait pas sur les commits de Claude.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

jobs:
  # 1. Mode interactif : mentionner @claude dans une issue, une PR ou une revue.
  #    Ex. « @claude corrige le test qui échoue » ou « @claude applique les retours de cette revue ».
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/{{GITHUB_OWNER}}/devflow.git"
          plugins: "devflow@oumar-plugins"
          claude_args: "--max-turns 60"

  # 2. Mode automatique : poser le label `ready-for-claude` sur une issue `task`
  #    lance /devflow:build, qui ouvre une PR. Le merge reste humain.
  build-from-label:
    if: github.event_name == 'issues' && github.event.label.name == 'ready-for-claude'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-build-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/{{GITHUB_OWNER}}/devflow.git"
          plugins: "devflow@oumar-plugins"
          prompt: "/devflow:build ${{ github.event.issue.number }}"
          claude_args: "--max-turns 100"
